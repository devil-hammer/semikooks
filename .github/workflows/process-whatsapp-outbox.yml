name: Process WhatsApp Outbox

on:
  workflow_dispatch:
  schedule:
    # Every 10 minutes
    - cron: '*/10 * * * *'

permissions:
  contents: read

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - name: Set up flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Run short-lived outbox processor
        run: |
          set -euo pipefail
          APP=surf-tracker-whatsapp-notifier
          MACHINE_ID=$(flyctl machines list -a "$APP" -j | jq -r '.[0].id // empty')
          if [ -z "$MACHINE_ID" ]; then
            echo "No Fly machine found. Deploy whatsapp-notifier first."
            exit 1
          fi

          machine_state() {
            flyctl machines list -a "$APP" -j | jq -r --arg id "$MACHINE_ID" '.[] | select(.id==$id) | .state'
          }

          # `flyctl machine wait -w 25m` gives up after ~1 minute on recent
          # flyctl versions (deadline_exceeded), so poll the state instead.
          wait_for_stopped() {
            local deadline=$(( $(date +%s) + $1 ))
            while [ "$(date +%s)" -lt "$deadline" ]; do
              if [ "$(machine_state)" = "stopped" ]; then
                return 0
              fi
              sleep 15
            done
            echo "Machine did not stop within $1 seconds."
            return 1
          }

          MACHINE_JSON=$(flyctl machines list -a "$APP" -j | jq -c --arg id "$MACHINE_ID" '.[] | select(.id==$id)')
          STATE=$(echo "$MACHINE_JSON" | jq -r '.state')
          UPDATED_AT=$(echo "$MACHINE_JSON" | jq -r '.updated_at // empty')
          echo "Using machine $MACHINE_ID (state=$STATE updated_at=$UPDATED_AT)"

          # A Fly volume can only attach to one machine. Reuse that machine
          # instead of creating a new one with `fly machine run --volume`.
          #
          # If a previous run is still started after ~12 minutes (QR wait / hung
          # WhatsApp init), stop it so the schedule can recover instead of
          # failing every cycle for hours.
          if [ "$STATE" = "started" ] || [ "$STATE" = "starting" ]; then
            AGE_SEC=0
            if [ -n "$UPDATED_AT" ]; then
              UPDATED_EPOCH=$(date -u -d "$UPDATED_AT" +%s 2>/dev/null || date -u -j -f "%Y-%m-%dT%H:%M:%SZ" "$UPDATED_AT" +%s 2>/dev/null || echo 0)
              NOW_EPOCH=$(date -u +%s)
              if [ "$UPDATED_EPOCH" -gt 0 ]; then
                AGE_SEC=$((NOW_EPOCH - UPDATED_EPOCH))
              fi
            fi
            echo "Machine already running (age=${AGE_SEC}s)"
            if [ "$AGE_SEC" -gt 720 ]; then
              echo "Previous run looks stuck; stopping machine before restart."
              flyctl machine stop "$MACHINE_ID" -a "$APP" || true
              wait_for_stopped 120 || true
              flyctl machine start "$MACHINE_ID" -a "$APP"
            else
              echo "Waiting for in-progress run to finish."
            fi
          else
            flyctl machine start "$MACHINE_ID" -a "$APP"
          fi

          # Wait for the batch job to finish. Previously we only checked that
          # the machine started, which hid processor failures (e.g. bad DB URL).
          echo "Waiting for machine to stop..."
          sleep 10
          wait_for_stopped 1500

          # Fly often omits exit_code on clean short-lived exits (events only
          # include signal/exited_at). Prefer exit_code when present; otherwise
          # confirm success from recent app logs.
          EXIT_EVENT=$(flyctl machines list -a "$APP" -j | jq -c --arg id "$MACHINE_ID" '
            [.[] | select(.id==$id) | .events[]? | select(.type=="exit")][0] // {}
          ')
          EXIT_CODE=$(echo "$EXIT_EVENT" | jq -r '.request.exit_event.exit_code // empty')
          EXIT_STATUS=$(echo "$EXIT_EVENT" | jq -r '.status // empty')
          echo "Machine exit event: status=${EXIT_STATUS:-unknown} exit_code=${EXIT_CODE:-omitted}"

          if [ -n "$EXIT_CODE" ] && [ "$EXIT_CODE" != "0" ]; then
            echo "Outbox processor failed (exit_code=$EXIT_CODE)."
            echo "Check Fly logs: fly logs -a $APP --no-tail"
            exit 1
          fi

          if [ -z "$EXIT_CODE" ]; then
            RECENT_LOGS=$(flyctl logs -a "$APP" --no-tail || true)
            if echo "$RECENT_LOGS" | grep -q 'Main child exited normally with code: 0'; then
              echo "Fly omitted exit_code; logs confirm clean exit (code 0)."
            elif echo "$RECENT_LOGS" | grep -Eq 'Main child exited normally with code: [1-9][0-9]*'; then
              echo "Outbox processor failed according to Fly logs."
              echo "$RECENT_LOGS" | tail -40
              exit 1
            elif echo "$RECENT_LOGS" | grep -q 'Outbox processor failed'; then
              echo "Outbox processor failed according to Fly logs."
              echo "$RECENT_LOGS" | tail -40
              exit 1
            elif [ "$EXIT_STATUS" = "stopped" ]; then
              echo "Fly omitted exit_code; machine stopped cleanly — treating as success."
            else
              echo "Could not confirm processor success (status=${EXIT_STATUS:-unknown})."
              echo "Check Fly logs: fly logs -a $APP --no-tail"
              exit 1
            fi
          fi
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
